<!DOCTYPE html>
<html>
<head>

    <title>StatTrack | Account</title>
    <link rel="stylesheet" href="style.css">
    <script src = "api.js"></script>
    <script src = "script.js"></script>

</head>
<body>
    
    <!-- Site Header -->
    <header>
        <table>
            <tr>
                <td>
                    <img id="header-image" src="stattrack_logo.png" alt="StatTrack Logo" width="50" height="50">
                </td>
                <td>
                    <h1>StatTrack</h1>
                </td>
            </tr>
        </table>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="players.html">Players</a>
        <a href="teams.html">Teams</a>
        <a href="thestats.html">The Stats</a>
        <a href="aboutus.html">About Us</a>
    </nav>

    <!-- Page Header -->
    <div class="simple-text">
        <h2>Account</h2>
    </div>

    <!-- Deletion Block -->
    <div class="simple-text" id="deletion-success" style="display:none;">
        <p>Account Successfully Deleted</p>
    </div>

    <!-- Account Block -->
    <div class="simple-text" id="account-block">
        <p>
            USERNAME: <span id="display-username">
                <br><br>
            ACCOUNT CREATED: <span id="account-created"></span>
            <br><br><br>
            <button onclick="logoutUser()">Logout</button>
            <br><br>
            <div id="delete-account" style="display:none;">
                Type "DELETE" and re-click delete account to DELETE YOUR ACCOUNT
                <br><br>
                <input type="text" id="delete-input"></input>
                <br><br>
            </div>
            <button onclick="deleteUser()">Delete Account</button>
            <br><br>
            <span id="delete-error"></span>
            <br><br><br><br><br><br><br><br><br><br>
        </p>
    </div>

    <!-- Site Footer -->
    <footer>
        <div class="little-br"></div>
        <p>
            Have Concerns? Contact Us!<br>
            <a href="mailto:ncatstattrack@gmail.com">Send Email</a> (ncatstattrack@gmail.com)
        </p>
    </footer>

</body>
