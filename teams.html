<!DOCTYPE html>
<html>
<head>

    <title>StatTrack | Teams</title>
    <link rel="stylesheet" href="style.css">
    <script src = "api.js"></script>
    <script src = "script.js"></script>

</head>
<body onload="getTeamInfo() ">
    
    <!-- Site Header -->
    <header>
        <table>
            <tr>
                <td>
                    <img id="header-image" src="stattrack_logo.png" alt="StatTrack Logo" width="50" height="50">
                </td>
                <td>
                    <h1>StatTrack</h1>
                </td>
            </tr>
        </table>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a> |
        <a href="players.html">Players</a> |
        <a href=# onclick="return false;">Teams</a> |
        <a href="thestats.html">The Stats</a> |
        <a href="aboutus.html">About Us</a>
    </nav>

    <!-- Page Header -->
    <div class="simple-text">
        <h2>Team Statistics</h2>
    </div>

    <!-- Loading message -->
    <div class="simple-text" id="waiting-message" style="display: block;">
        <p>Loading team info...</p>
    </div>

    <!-- Search area -->
    <div class="simple-text" id="search-find-team-stats" style="display: none;">
        <table>
            <tr>
                <td>
                    <label for="find-team-list">Team:</label>
                    <input list="find-team-list" name="find-team-input" id="find-team-input"></input>
                    <datalist id="find-team-list"></datalist>
                    <button onclick="switchStatMode()"><strong>+</strong></button>
                </td>
            </tr>
            <tr>
                <td>
                    <table>
                        <tr>
                            <td>
                                <input type="radio" id="find-career" name="find-career-season" value="career" checked>
                                <label for="find-career">All-Time Stats</label>
                            </td>
                            <td>
                                <input type="radio" id="find-season" name="find-career-season" value="season">
                                <label for="find-season">Season Stats</label>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr id="find-season-range-block" style="display: none;">
                <td>
                    <label for="find-from-input">From:</label>
                    <input type="text" placeholder="Ex. 2015-16" name="find-from-input" id="find-from-input" value=""></input>
                    <label for="find-to-input">To:</label>
                    <input type="text" placeholder="Ex. 2018-19" name="find-to-input" id="find-to-input" value=""></input>
                </td>
            </tr>
        </table>

        <br>
        <button onclick="getTeamStats()">Get Data</button>
        <br>
    </div>

    <div class="simple-text" id="search-compare-team-stats" style="display: none;">
        <table>
            <tr>
                <td>
                    <label for="compare-team-list-1">First Team:</label>
                    <input list="compare-team-list-1" name="compare-team-input-1" id="compare-team-input-1"></input>
                    <datalist id="compare-team-list-1"></datalist>
                </td>
                <td>
                    <label for="compare-team-list-2">Second Team:</label>
                    <input list="compare-team-list-2" name="compare-team-input-2" id="compare-team-input-2"></input>
                    <datalist id="compare-team-list-2"></datalist>
                    <button onclick="switchStatMode()"><strong>-</strong></button>
                </td>
            </tr>
            <tr>
                <td>
                    <table>
                        <tr>
                            <td>
                                <input type="radio" id="compare-career" name="compare-career-season" value="career" checked>
                                <label for="compare-career">All-Time Stats</label>
                            </td>
                            <td>
                                <input type="radio" id="compare-season" name="compare-career-season" value="season">
                                <label for="compare-season">Season Stats</label>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr id="compare-season-range-block" style="display: none;">
                <td>
                    <label for="compare-from-input-1">From:</label>
                    <input type="text" placeholder="Ex. 2015-16" name="compare-from-input-1" id="compare-from-input-1" value=""></input>
                    <div class="little-br"></div>
                    <label for="compare-to-input-1">To:</label>
                    <input type="text" placeholder="Ex. 2018-19" name="compare-to-input-1" id="compare-to-input-1" value=""></input>
                </td>
                <td>
                    <label for="compare-from-input-2">From:</label>
                    <input type="text" placeholder="Ex. 2015-16" name="compare-from-input-2" id="compare-from-input-2" value=""></input>
                    <div class="little-br"></div>
                    <label for="compare-to-input-2">To:</label>
                    <input type="text" placeholder="Ex. 2018-19" name="compare-to-input-2" id="compare-to-input-2" value=""></input>
                </td>
            </tr>
        </table>

        <br>
        <button onclick="getTeamStats()">Get Data</button>
        <br>
    </div>

    <!-- Display area -->
    <hr>
    <div class="just-arial" id="display-find-team-stats" style="display: none;">
    </div>
    <div class="just-arial" id="display-compare-team-stats" style="display: none;">
    </div>
    <br><br>
    <div id="footer-buffer">
    </div>

    <!-- Site Footer -->
    <footer>
        <div class="little-br"></div>
        <p>
            Have Concerns? Contact Us!<br>
            <a href="mailto:ncatstattrack@gmail.com">Send Email</a> (ncatstattrack@gmail.com)
        </p>
    </footer>


</body>
</html>
